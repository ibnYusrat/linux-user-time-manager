<!DOCTYPE html>
<html>
<head>
    <title>Time Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; max-width: 600px; margin: 0 auto; }
        .user-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .usage { text-align: center; }
        .bonus-badge { background: #E8F5E9; color: #2E7D32; padding: 5px 10px; border-radius: 15px; font-size: 0.8em; font-weight: bold; margin-top: 5px; display: inline-block; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-extend { background: #4CAF50; color: white; }
        .btn-update { background: #2196F3; color: white; grid-column: span 2; }
        .schedule { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #666; }
        input[type="time"] { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        #totp-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        #totp-code { font-size: 2em; width: 100%; text-align: center; letter-spacing: 10px; margin: 20px 0; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>User Time Manager</h1>

    {% for user in users %}
    <div class="user-card" id="card-{{ user.username }}">
        <div class="stats">
            <div style="font-size: 1.2em; font-weight: bold;">{{ user.username }}</div>
            <div class="usage">
                <label>Usage Today</label>
                <div style="font-size: 1.5em; font-weight: bold; color: #2196F3;">{{ user.usage_today_formatted }}</div>
                {% if user.has_exception %}
                <div class="bonus-badge">Bonus until {{ user.exception_time }}</div>
                {% endif %}
            </div>
        </div>

        <div class="controls">
            <button class="btn-extend" onclick="promptTOTP('extend', '{{ user.username }}', 15)">+15 Mins</button>
            <button class="btn-extend" onclick="promptTOTP('extend', '{{ user.username }}', 60)">+1 Hour</button>
            {% if user.has_exception %}
            <button style="background: #f44336; color: white; grid-column: span 2;" onclick="cancelBonus('{{ user.username }}')">Cancel Bonus Time</button>
            {% endif %}
        </div>

        <div class="schedule">
            <label>Start Time:</label>
            <input type="time" id="start-{{ user.username }}" value="{{ user.start_time[:2] }}:{{ user.start_time[2:] }}">
            <label>End Time:</label>
            <input type="time" id="end-{{ user.username }}" value="{{ user.end_time[:2] }}:{{ user.end_time[2:] }}">
            <button class="btn-update" onclick="promptTOTP('update', '{{ user.username }}')">Update Schedule</button>
        </div>
    </div>
    {% endfor %}

    <div id="totp-modal">
        <div class="modal-content">
            <h3>Enter 2FA Code</h3>
            <p>Please enter the 6-digit code from your app.</p>
            <input type="text" id="totp-code" maxlength="6" inputmode="numeric" placeholder="000000" oninput="checkAutoSubmit()">
            <div style="display: flex; gap: 10px;">
                <button id="modal-cancel-btn" style="background: #ccc; flex: 1;" onclick="closeModal()">Cancel</button>
                <button id="modal-auth-btn" style="background: #4CAF50; color: white; flex: 2;" onclick="executeAction()">Authorize</button>
            </div>
        </div>
    </div>

    <script>
        let currentAction = null;

        function checkAutoSubmit() {
            const code = document.getElementById('totp-code').value;
            if (code.length === 6) {
                executeAction();
            }
        }

        function promptTOTP(type, username, value) {
            currentAction = { type, username, value };
            document.getElementById('totp-modal').style.display = 'flex';
            document.getElementById('totp-code').focus();
            document.getElementById('totp-code').value = '';
            document.getElementById('modal-auth-btn').disabled = false;
            document.getElementById('modal-auth-btn').innerText = 'Authorize';
        }

        function closeModal() {
            document.getElementById('totp-modal').style.display = 'none';
        }

        function cancelBonus(username) {
            if (!confirm('Are you sure you want to cancel the bonus time for ' + username + '?')) return;
            
            fetch('/api/cancel_bonus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    location.reload();
                } else {
                    alert('Error: ' + data.message);
                }
            });
        }

        function executeAction() {
            const code = document.getElementById('totp-code').value;
            if (code.length !== 6) return;

            const authBtn = document.getElementById('modal-auth-btn');
            authBtn.disabled = true;
            authBtn.innerText = 'Verifying...';

            let url = '';
            let body = { code, username: currentAction.username };

            if (currentAction.type === 'extend') {
                url = '/api/extend';
                body.minutes = currentAction.value;
            } else {
                url = '/api/update_schedule';
                body.start_time = document.getElementById('start-' + currentAction.username).value;
                body.end_time = document.getElementById('end-' + currentAction.username).value;
            }

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    location.reload();
                } else {
                    alert('Error: ' + data.message);
                    authBtn.disabled = false;
                    authBtn.innerText = 'Authorize';
                    document.getElementById('totp-code').value = '';
                    document.getElementById('totp-code').focus();
                }
            });
        }
    </script>
</body>
</html>
